services:
  - type: web
    name: ine-price-tracker-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx playwright install --with-deps chromium
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: STORE_BASE_URL
        value: https://demo.inelabteamdev.com
      - key: SCRAPE_INTERVAL_MINUTES
        value: "120"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
